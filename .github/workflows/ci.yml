# Intégration continue d'Expense.io. Décision et justification :
# docs/adr/ADR-005-harnais-de-validation.md (§3).
#
# - check       : lint, types, tests unitaires et de composants, absence de
#                 rupture du contrat d'API (oasdiff, sur les PR) et build de
#                 production, sans infrastructure ;
# - integration : tests Vitest `*.integration.test.ts` (ADR-009) contre
#                 Postgres, LocalStack et Mailpit lancés depuis
#                 docker-compose.yml, comme `make test-integration` ;
# - e2e         : suite Playwright de docs/tests/E2E.md, contre `next dev`
#                 comme `make test-e2e`, avec Postgres, LocalStack et Mailpit
#                 lancés depuis docker-compose.yml (qui fait foi pour les images
#                 et les ports : rien n'est recopié ici). La suite est découpée
#                 en 2 shards, chacun sur sa machine avec sa propre base et son
#                 propre serveur ; le job `e2e` fusionne leurs rapports et porte
#                 le résultat, celui du job `integration` compris.
#
# Tous les jobs restent sur les runners hébergés par GitHub : le dépôt est
# public, et une PR venant d'un fork peut réécrire `runs-on` ; un runner
# auto-hébergé exécuterait alors du code externe sur la machine qui l'héberge.
#
# Les deux checks sont destinés à être obligatoires pour fusionner sur `main`.
# Locale, la même vérification se lance avec `make verify`.
name: CI

on:
  # Seulement les PR qui visent main : une PR empilée sur une autre branche
  # n'est vérifiée qu'une fois rebasée sur main.
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

# Un nouveau push sur une PR annule l'exécution en cours ; sur main, chaque
# commit est vérifié jusqu'au bout.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  NEXT_TELEMETRY_DISABLED: '1'

jobs:
  check:
    name: check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Lint, types et tests unitaires
        run: npm run check
      # Rupture du contrat d'API par rapport à la branche visée (ADR-004 §7,
      # oasdiff). Une rupture voulue : ADR acceptée, label `rupture-contrat`
      # sur la PR, puis relancer ce job.
      - name: Contrat d'API sans rupture (oasdiff)
        if: github.event_name == 'pull_request' && !contains(github.event.pull_request.labels.*.name, 'rupture-contrat')
        env:
          OASDIFF_FORMAT: githubactions
        run: |
          git fetch --no-tags --depth=1 origin "${{ github.base_ref }}"
          bash scripts/check-api-breaking.sh "origin/${{ github.base_ref }}"
      # Migrations et tests E2E déjà dans la branche visée : inchangés
      # (ADR-005 §2, scripts/frozen.mjs). Un test qui doit changer : ADR
      # acceptée, label `changement-e2e` sur la PR, puis un nouveau push (le
      # label est lu dans l'événement qui lance la CI). Rien ne lève la règle
      # pour une migration.
      - name: Migrations et tests E2E existants inchangés
        if: github.event_name == 'pull_request'
        run: |
          git fetch --no-tags --depth=1 origin "${{ github.base_ref }}"
          node scripts/check-frozen.mjs "origin/${{ github.base_ref }}" ${{ contains(github.event.pull_request.labels.*.name, 'changement-e2e') && '--e2e-change-approved' || '' }}
      # Même configuration qu'un poste de dev : .env créé depuis .env.example.
      - run: make env
      - name: Build de production
        run: npm run build

  e2e-shard:
    name: e2e (${{ matrix.shard }}/2)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      E2E_CHROMIUM_PATH: /usr/bin/google-chrome
    strategy:
      # Un shard en échec n'arrête pas l'autre : le rapport fusionné reste complet.
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # Aucun téléchargement ni `apt` : l'image ubuntu-latest fournit Google
      # Chrome et ses dépendances système. `playwright install --with-deps`
      # prenait jusqu'à 13 min (apt, hors cache). playwright.config.ts le lance
      # via E2E_CHROMIUM_PATH (docs/tests/E2E.md).
      - name: Chrome du runner
        run: |
          test -x "$E2E_CHROMIUM_PATH"
          "$E2E_CHROMIUM_PATH" --version
      # Mêmes prérequis que `make test-e2e` : .env depuis .env.example (base et
      # S3 jetables, aucun secret GitHub), Docker, migrations, bucket. Avec
      # CI=true, playwright.config.ts interdit test.only, autorise un nouvel
      # essai, utilise 2 workers et démarre lui-même `next dev`.
      - name: Postgres, LocalStack, Mailpit et migrations
        run: make up migrate ensure-bucket
      - name: Tests E2E (shard ${{ matrix.shard }}/2)
        run: npm run test:e2e -- --shard=${{ matrix.shard }}/2 --reporter=list,blob
      - name: Rapport du shard
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: blob-report-${{ matrix.shard }}
          path: blob-report/
          retention-days: 1
      - name: Traces et captures des échecs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-${{ matrix.shard }}
          path: test-results/
          retention-days: 7
      - name: Journaux de Postgres, LocalStack et Mailpit
        if: failure()
        run: docker compose logs --no-color --tail=200

  # Couche d'intégration (ADR-009) : adaptateurs, cas d'usage, routes appelées
  # dans le processus et handlers du worker, contre la vraie base sous la RLS,
  # le S3 et le SMTP de docker-compose.yml. Sans navigateur ni serveur.
  integration:
    name: integration
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # Mêmes prérequis que `make test-integration` : .env depuis .env.example,
      # Docker, migrations, bucket.
      - name: Postgres, LocalStack, Mailpit et migrations
        run: make up migrate ensure-bucket
      - name: Tests d'intégration
        run: npm run test:integration
      - name: Journaux de Postgres, LocalStack et Mailpit
        if: failure()
        run: docker compose logs --no-color --tail=200

  # Check unique à rendre obligatoire : fusionne les rapports des shards et
  # échoue si l'un d'eux, ou le job `integration`, a échoué ou n'a pas tourné
  # (ADR-009 : le ruleset ne change pas).
  e2e:
    name: e2e
    needs: [e2e-shard, integration]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v7
        with:
          pattern: blob-report-*
          path: all-blob-reports
          merge-multiple: true
      - name: Fusionner les rapports
        run: npx playwright merge-reports --reporter=html,list ./all-blob-reports
      - name: Rapport Playwright
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
      - name: Résultat des shards et de l'intégration
        if: ${{ needs.e2e-shard.result != 'success' || needs.integration.result != 'success' }}
        run: |
          echo "Shards E2E : ${{ needs.e2e-shard.result }} ; intégration : ${{ needs.integration.result }}"
          exit 1
