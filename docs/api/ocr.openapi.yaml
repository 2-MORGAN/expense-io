openapi: 3.1.0
info:
  title: Expense.io — OCR
  version: 1.0.0
  description: Contrat du module OCR (ADR-004 §8.3), à intégrer au contrat global de 2-486.
security:
  - session: []
paths:
  /api/expense-notes/receipt-suggestion:
    post:
      operationId: suggestReceiptFields
      summary: Analyse synchrone conservée pour compatibilité
      requestBody:
        $ref: '#/components/requestBodies/Receipt'
      responses:
        '200':
          description: Suggestion, éventuellement vide (PDF ou aucun champ reconnu)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReceiptSuggestion'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '500':
          $ref: '#/components/responses/Problem'
        '503':
          $ref: '#/components/responses/Unavailable'
  /api/receipt-analyses:
    post:
      operationId: launchReceiptAnalysis
      summary: Enregistre durablement une analyse, avant de répondre 202
      parameters:
        - name: Idempotency-Key
          in: header
          required: false
          schema:
            type: string
            format: uuid
          description: Rejeu identique pendant 24 h ; autre contenu avec la même clé donne 422.
      requestBody:
        $ref: '#/components/requestBodies/Receipt'
      responses:
        '202':
          description: Analyse acceptée, ou rejeu d'une analyse existante
          headers:
            Location:
              required: true
              schema:
                type: string
              description: URL relative de suivi
            Cache-Control:
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnalysisAccepted'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/Problem'
        '500':
          $ref: '#/components/responses/Problem'
        '503':
          $ref: '#/components/responses/Unavailable'
  /api/receipt-analyses/{id}:
    get:
      operationId: getReceiptAnalysis
      summary: Consulte sa propre analyse, conservée pendant 24 h
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: État courant ; une analyse failed reste un GET réussi
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReceiptAnalysis'
        '401':
          $ref: '#/components/responses/Problem'
        '404':
          description: Analyse inconnue, étrangère, expirée ou identifiant malformé
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '500':
          $ref: '#/components/responses/Problem'
components:
  securitySchemes:
    session:
      type: apiKey
      in: cookie
      name: authjs.session-token
      description: Cookie Auth.js ; préfixe __Secure- en HTTPS selon sa configuration.
  requestBodies:
    Receipt:
      required: true
      content:
        multipart/form-data:
          schema:
            type: object
            required: [receipt]
            additionalProperties: false
            properties:
              receipt:
                type: string
                format: binary
                description: PNG/JPEG/WebP ou PDF ; non vide, 10 Mio maximum, images 40 Mpx maximum.
  responses:
    Problem:
      description: Refus explicite ou erreur interne, sans fuite technique
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Unavailable:
      description: OCR_UNAVAILABLE, OCR_TIMEOUT ou OCR_OVERLOADED
      headers:
        Retry-After:
          required: true
          schema:
            type: string
            const: '5'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
  schemas:
    ReceiptSuggestion:
      type: object
      additionalProperties: false
      properties:
        amount:
          type: number
          exclusiveMinimum: 0
        expenseDate:
          type: string
          format: date
    AnalysisAccepted:
      type: object
      required: [id, status]
      properties:
        id:
          type: string
          format: uuid
        status:
          type: string
          enum: [queued, running, succeeded, failed]
    ReceiptAnalysis:
      allOf:
        - $ref: '#/components/schemas/AnalysisAccepted'
        - type: object
          properties:
            result:
              $ref: '#/components/schemas/ReceiptSuggestion'
            error:
              $ref: '#/components/schemas/Problem'
    Problem:
      type: object
      required: [type, title, status, detail, code, requestId]
      properties:
        type:
          type: string
          format: uri-reference
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        code:
          type: string
          enum: [VALIDATION_ERROR, RECEIPT_TOO_LARGE, RECEIPT_TYPE_NOT_ALLOWED, IMAGE_TOO_LARGE, OCR_UNAVAILABLE, OCR_TIMEOUT, OCR_OVERLOADED, AUTHENTICATION_REQUIRED, RESOURCE_NOT_FOUND, INVALID_IDEMPOTENCY_KEY, IDEMPOTENCY_KEY_REUSED, INTERNAL_ERROR]
        requestId:
          type: string
          format: uuid
        error:
          type: string
          deprecated: true
